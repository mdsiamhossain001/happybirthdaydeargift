<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Món Quà Đặc Biệt Cho Bạn 🎁</title>
<meta name="description" content="Một món quà đầy yêu thương đang chờ bạn khám phá!">
<meta name="theme-color" content="#000000">

<link rel="icon" type="image/png" href="./image/logo.png">
<link rel="apple-touch-icon" href="./image/logo.png">

<meta property="og:title" content="Món Quà Đặc Biệt Cho Bạn 🎁">
<meta property="og:description" content="Một món quà đầy yêu thương đang chờ bạn khám phá!">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/index.css">

<script>
// Load lang.js trước
window.LANG = window.LANG || {};
</script>
</head>

<body>

<canvas id="matrix-rain"></canvas>

<div class="overlay">
  <div id="gift-image-container"></div>

  <div class="content-display" id="contentDisplay">
    <p id="contentText"></p>
  </div>

  <div class="book-container" id="bookContainer">
    <div class="book" id="book"></div>
  </div>

  <button class="music-control" id="musicControl" title="Play/Pause">▶</button>
  <button class="settings-button" id="settingsButton" title="Settings">⚙</button>
  <button id="langSwitchBtn" class="lang-switch">EN/VI</button>

  <!-- ============ SETTINGS MODAL ============ -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 data-i18n="settings">⚙️ Cài Đặt</h2>
        <span class="close" id="closeSettings">&times;</span>
      </div>
      <div class="modal-body">

        <div class="settings-section">
          <h3 data-i18n="music">🎵 Âm Thanh</h3>
          <div class="form-group">
            <label for="musicFile" data-i18n="musicFile">Chọn nhạc (MP3):</label>
            <input type="file" id="musicFile" accept="audio/*">
            <small style="color:#888;font-size:12px;" data-i18n="musicHint">Hoặc để trống dùng nhạc mặc định</small>
          </div>
        </div>

        <div class="settings-section">
          <h3 data-i18n="countdown">⏰ Đếm Ngược</h3>
          <div class="form-group">
            <label for="countdownTime" data-i18n="countdownTime">Thời gian:</label>
            <select id="countdownTime">
              <option value="3" data-i18n="sec3">3 giây</option>
              <option value="5" selected data-i18n="sec5">5 giây</option>
              <option value="10" data-i18n="sec10">10 giây</option>
            </select>
          </div>
        </div>

        <div class="settings-section">
          <h3 data-i18n="matrix">🌧️ Mưa Chữ</h3>
          <div class="form-group">
            <label for="matrixText" data-i18n="matrixText">Chữ mưa:</label>
            <input type="text" id="matrixText" value="HAPPYBIRTHDAY">
          </div>
          <div class="form-group">
            <label data-i18n="colorTheme">Màu:</label>
            <div class="color-theme-buttons">
              <button type="button" class="color-theme-btn active" data-theme="pink">
                <div class="color-preview pink-preview"></div>
                <span data-i18n="pinkTheme">Hồng</span>
              </button>
              <button type="button" class="color-theme-btn" data-theme="blue">
                <div class="color-preview blue-preview"></div>
                <span data-i18n="blueTheme">Xanh</span>
              </button>
              <button type="button" class="color-theme-btn" data-theme="purple">
                <div class="color-preview purple-preview"></div>
                <span data-i18n="purpleTheme">Tím</span>
              </button>
              <button type="button" class="color-theme-btn" data-theme="custom">
                <div class="color-preview custom-preview"></div>
                <span data-i18n="customTheme">Tùy chỉnh</span>
              </button>
            </div>
          </div>
          <div class="form-row" id="customColorSection" style="display:none;">
            <div class="form-group">
              <label data-i18n="matrixColor1">Màu 1:</label>
              <input type="color" id="matrixColor1" value="#ff69b4">
            </div>
            <div class="form-group">
              <label data-i18n="matrixColor2">Màu 2:</label>
              <input type="color" id="matrixColor2" value="#ff1493">
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h3 data-i18n="sequence">✨ Chữ Chính</h3>
          <div class="form-group">
            <label for="sequenceText" data-i18n="sequenceText">Nội dung (cách bằng |):</label>
            <input type="text" id="sequenceText" value="HAPPY|BIRTHDAY|MY|CUTEE|LITTLE|SWARALI|❤">
          </div>
        </div>

        <div class="settings-section">
          <h3 data-i18n="gift">🎁 Hình Động</h3>
          <div class="form-group">
            <label for="giftImage" data-i18n="giftImage">Chọn GIF:</label>
            <select id="giftImage">
              <option value="" data-i18n="noGif">Không có</option>
              <option value="./happy.gif">happy.gif</option>
            </select>
          </div>
        </div>

        <div class="settings-section">
          <h3 data-i18n="book">📖 Trang Sách</h3>
          <div class="form-group">
            <label for="enableBook" data-i18n="enableBook">Hiển thị sách:</label>
            <select id="enableBook">
              <option value="true" data-i18n="on">Bật</option>
              <option value="false" data-i18n="off">Tắt</option>
            </select>
          </div>
          <div class="form-group">
            <label for="enableHeart" data-i18n="enableHeart">Hiệu ứng trái tim:</label>
            <select id="enableHeart">
              <option value="true" data-i18n="on">Bật</option>
              <option value="false" data-i18n="off">Tắt</option>
            </select>
          </div>
        </div>

        <button id="applySettings" class="apply-settings-btn" data-i18n="apply">🎉 Áp Dụng</button>
      </div>
    </div>
  </div>

  <audio id="birthdayAudio" loop preload="auto">
    <source src="./music/happybirthday.mp3" type="audio/mpeg">
  </audio>

  <div class="copyright">
    Made with ❤️ · <a href="https://github.com" target="_blank">GitHub</a>
  </div>
</div>

<!-- Scripts -->
<script src="./lang.js"></script>
<script src="./jscp/detect-devtools.js"></script>
<script src="./jscp/main.js"></script>
<script src="./jscp/ui.js"></script>

</body>
</html>
